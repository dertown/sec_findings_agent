# Judge pipeline for the backend Finding Evidence Agent.
# Copy stanzas to local/judges.conf to add or override judges without
# changing the app. Custom Python files must live in local/judges/ or judges/.

[default]
auto_load_local = 1

[followup_score]
enabled = 1
type = builtin
class = FollowupScoreJudge
weight = 1.0
mode = vote

[triage_guardrail]
enabled = 1
type = builtin
class = TriageGuardrailJudge
weight = 0.9
mode = override

[critical_asset]
enabled = 1
type = builtin
class = CriticalAssetJudge
weight = 0.25
mode = adjust

# Conf-only rule example (disabled). Enable in local/judges.conf to force
# investigation for every critical finding.
[policy_critical_always]
enabled = 0
type = rule
mode = override
weight = 1.0
when_urgency = critical
decision = Yes
score = 90
rationale = Policy: every critical finding is investigated.

# Example Python judges shipped under judges/. Enable in local/judges.conf.
[example_vip_user]
enabled = 0
type = python
file = example_vip_user.py
function = judge
mode = override
weight = 0.9

[example_offhours]
enabled = 0
type = python
file = example_offhours.py
function = judge
mode = adjust
weight = 1.0
