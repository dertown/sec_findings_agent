[ES Finding Evidence - Score Open Queue]
description = Pull recent ES findings (or demo data if ES is unreachable), score follow-up, and write the latest results to the KV store lookup.
enableSched = 0
cron_schedule = 15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = | loadfindings mode=auto limit=200 include_notes=true \
| table finding_id, title, urgency, status, owner, disposition, risk_score, user, src, dest, \
  triage_present, triage_disposition, triage_summary, triage_confidence, \
  followup_score, followup_score_ceiling, investigation_required, investigation_label, \
  evidence_net_weight, recommended_search_count, evidence_count, rationale, _time \
| outputlookup finding_evidence_scores
request.ui_dispatch_app = es_finding_evidence
request.ui_dispatch_view = overview
is_visible = 1

[ES Finding Evidence - Demo Samples]
description = Run the bundled sample findings through evidence weighting and follow-up scoring.
enableSched = 0
search = | loadfindings mode=demo \
| table finding_id, title, urgency, triage_disposition, followup_score, investigation_required, evidence_net_weight, recommended_search_count
is_visible = 1

[ES Finding Evidence - Workbench Search Catalog]
description = Show recommended evidence searches for every demo finding.
enableSched = 0
search = | loadfindings mode=demo expand=searches \
| table finding_id, title, followup_score, investigation_required, search_category, search_name, search_purpose, potential_weight, search_spl
is_visible = 1

[ES Finding Evidence - Agent Cycle]
description = Run one backend agent cycle (gather evidence, apply judges, emit scores). Prefer the modular input for production schedules.
enableSched = 0
cron_schedule = 20 * * * *
search = | findingagent mode=auto run_searches=true limit=25 tasks=gather_evidence,score,emit \
| table finding_id, title, followup_score, investigation_required, executed_search_count, override_applied, judges_json
is_visible = 1
