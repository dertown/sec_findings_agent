[loadfindings-command]
syntax = loadfindings (mode=<demo|rest|auto>)? (finding_id=<string>)? (status=<string>)? (urgency=<string>)? (limit=<int>)? (expand=<none|searches|evidence>)? (include_notes=<bool>)? (score=<bool>)?
description = Load Splunk Enterprise Security findings (or bundled demo findings), attach Triage agent enrichment, recommend evidence searches, weight evidence, and compute a follow-up score.
shortdesc = Load ES findings and score investigation follow-up
usage = public
example1 = | loadfindings mode=demo
comment1 = Score bundled sample findings without Enterprise Security installed
example2 = | loadfindings mode=rest status=new limit=50
comment2 = Pull open findings from the ES Mission Control API
example3 = | loadfindings mode=rest finding_id=F-1001 expand=searches
comment3 = Workbench view: one row per recommended evidence search
related = findingevidence
tags = es findings triage investigation evidence

[findingevidence-command]
syntax = findingevidence (expand=<none|searches|evidence>)? (window_minutes=<int>)? (investigate_threshold=<num>)? (review_threshold=<num>)? (max_searches=<int>)?
description = For each finding on the pipeline, generate evidence-search recommendations, weight observed evidence (including Triage agent enrichment), and produce a 0-100 follow-up score plus an investigation decision (Yes/Review/No).
shortdesc = Weight evidence and score whether a finding needs follow-up
usage = public
example1 = index=notable | head 20 | findingevidence
comment1 = Score notables already on the pipeline
example2 = | loadfindings mode=demo | findingevidence expand=evidence
comment2 = One row per weighted evidence item
example3 = | loadfindings mode=demo | findingevidence expand=searches
comment3 = One row per recommended SPL search
related = loadfindings
tags = es findings triage evidence scoring
