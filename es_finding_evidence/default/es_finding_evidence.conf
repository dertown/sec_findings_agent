# Default scoring policy for Finding Evidence Advisor.
# Copy to local/es_finding_evidence.conf to tune without editing the app.

[scoring]
investigate_threshold = 50
review_threshold = 30
urgency_weight = 0.22
risk_weight = 0.18
evidence_weight = 0.22
triage_weight = 0.18
killchain_weight = 0.10
corroboration_weight = 0.10
max_searches = 12
window_minutes = 60

[findings]
# Mission Control public API (ES 8.x). Requires mc_investigation_read.
rest_path = /servicesNS/nobody/missioncontrol/public/v2/findings
fallback_index = notable

[triage]
# Parse Triage agent Analysis panel fields and finding notes.
parse_notes = true
field_prefix = triage_

[agent]
tasks = gather_evidence,score,persist,emit
run_searches = true
max_searches_per_finding = 4
search_timeout = 25
write_notes = false
create_investigation = false
