[finding_evidence_scores]
external_type = kvstore
collection = finding_evidence_scores
fields_list = finding_id, title, urgency, status, owner, disposition, risk_score, user, src, dest, triage_present, triage_disposition, triage_summary, triage_confidence, followup_score, followup_score_ceiling, investigation_required, investigation_label, evidence_net_weight, recommended_search_count, evidence_count, rationale, _time, executed_search_count, override_applied, agent_tasks, judges_json, enrichment_posted, enrichment_error
case_sensitive_match = false

[fea_custom_judges]
external_type = kvstore
collection = fea_custom_judges
fields_list = name, type, enabled, weight, mode, source, updated, rationale, decision, score, adjustment, confidence, python, file, function, when_urgency, when_status, when_disposition, when_triage_disposition, when_asset_priority, when_identity_priority, when_min_risk, when_title_contains, when_user_in
case_sensitive_match = false

[finding_enrichment]
external_type = kvstore
collection = finding_enrichment
fields_list = finding_id, title, note, enrichment_posted, enrichment_error, _time, fea_followup_score, fea_investigation_required, fea_investigation_label, fea_evidence_net_weight, fea_executed_search_count, fea_recommended_search_count, fea_override_applied, fea_triage_disposition, fea_triage_confidence, fea_triage_summary, fea_agent_summary, fea_agent_tasks, fea_score_breakdown_json, fea_judges_json, fea_evidence_json, fea_executed_searches_json, fea_recommended_searches_json, fea_enrichment_marker
case_sensitive_match = false

[evidence_weights]
filename = evidence_weights.csv

[search_templates]
filename = search_templates.csv

[sample_findings]
filename = sample_findings.csv
