[finding_evidence_scores]
external_type = kvstore
collection = finding_evidence_scores
fields_list = finding_id, title, urgency, status, owner, disposition, risk_score, user, src, dest, triage_present, triage_disposition, triage_summary, triage_confidence, followup_score, followup_score_ceiling, investigation_required, investigation_label, evidence_net_weight, recommended_search_count, evidence_count, rationale, _time, executed_search_count, override_applied, agent_tasks, judges_json
case_sensitive_match = false

[evidence_weights]
filename = evidence_weights.csv

[search_templates]
filename = search_templates.csv

[sample_findings]
filename = sample_findings.csv
