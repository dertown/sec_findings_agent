[es_load_findings]
definition = loadfindings mode=rest limit=100
iseval = 0
description = Load open-ish ES findings from the Mission Control API and score them.

[es_load_findings(1)]
args = status
definition = loadfindings mode=rest status="$status$" limit=100
iseval = 0

[es_demo_findings]
definition = loadfindings mode=demo
iseval = 0
description = Score the bundled sample findings (no ES required).

[es_normalize_finding]
definition = eval finding_id=coalesce(finding_id, event_id, id), title=coalesce(title, rule_title, search_name)
iseval = 0
description = Light field alignment before | findingevidence on notables.

[es_finding_evidence_queue]
definition = loadfindings mode=auto limit=200 | where investigation_required="Yes" OR investigation_required="Review" | sort -followup_score
iseval = 0
description = Follow-up queue: findings that need investigation or review.
